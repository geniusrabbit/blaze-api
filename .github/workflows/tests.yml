name: Tests

on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  GO_VERSION: 1.26.x
  # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.1.4
  # Build tags of the optional drivers and integrations, so tag-gated
  # files are compiled and vetted too
  ALL_TAGS: migrate alldb jaeger amp

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run linters
      uses: golangci/golangci-lint-action@v8
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}
        args: --timeout=5m
    - name: Vet with all build tags
      run: go vet -tags "${{ env.ALL_TAGS }}" ./...

  vulncheck:
    runs-on: ubuntu-latest
    # Report known vulnerabilities without blocking merges until the
    # dependency update (phase 3) is done
    continue-on-error: true
    steps:
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    - uses: actions/checkout@v4
    - run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  test:
    needs: lint
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run tests with the race detector
      if: runner.os != 'Windows'
      run: go test -race ./...
    - name: Run tests
      # The race detector needs cgo with a C toolchain on Windows
      if: runner.os == 'Windows'
      run: go test ./...
    - name: Build with all build tags
      run: go build -tags "${{ env.ALL_TAGS }}" ./...

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v4
      - run: go test -covermode=atomic -coverprofile=profile.cov ./...
      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: profile.cov
          flag-name: Go-${{ env.GO_VERSION }}
          parallel: true

  # notifies that all test jobs are finished.
  finish:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: shogo82148/actions-goveralls@v1
        with:
          parallel-finished: true
